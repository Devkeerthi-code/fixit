# Local stack: PostgreSQL 16 + the backend. Run `docker compose up --build`, then the frontend with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixit
      POSTGRES_USER: fixit
      POSTGRES_PASSWORD: fixit-local-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixit -d fixit"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/fixit
      DB_USERNAME: fixit
      DB_PASSWORD: fixit-local-only
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:5173

volumes:
  pgdata:
