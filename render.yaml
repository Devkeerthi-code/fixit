# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: fixit-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
